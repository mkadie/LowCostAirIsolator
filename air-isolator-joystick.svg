<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ECEEF1"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B6BCC4" stroke-width="1.3"/>
    </pattern>
    <pattern id="glue" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F6D9A6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C9892F" stroke-width="1.2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1F2933"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#FBFAF7"/>
  <text x="40" y="44" font-size="23" font-weight="700" fill="#1F2933">Sealed Glue-In Unit — disposable module, push-fits into the sensor tube</text>
  <text x="40" y="70" font-size="14" fill="#5A6470">Cot cuff is captured in the seam and bonded at assembly. No field-serviceable seal — replace the whole low-cost Unit.</text>

  <!-- ===== FRONT SHELL (dirty) ===== -->
  <!-- mouthpiece stub -->
  <rect x="70" y="266" width="64" height="10" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="70" y="304" width="64" height="10" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <!-- front shell walls -->
  <rect x="120" y="210" width="300" height="14" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="120" y="356" width="300" height="14" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="120" y="224" width="14" height="52" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="120" y="304" width="14" height="52" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <!-- dirty fill -->
  <rect x="70" y="276" width="64" height="28" fill="#F3DFC9"/>
  <rect x="134" y="224" width="282" height="132" fill="#F3DFC9" opacity="0.75"/>
  <line x1="46" y1="290" x2="118" y2="290" stroke="#1F2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="44" y="256" font-size="12.5" fill="#5A6470">breath in</text>

  <!-- ===== REAR SHELL (clean) ===== -->
  <rect x="454" y="210" width="266" height="14" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="454" y="356" width="266" height="14" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="706" y="224" width="14" height="56" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="706" y="300" width="14" height="56" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="454" y="224" width="252" height="132" fill="#D8EAEF" opacity="0.85"/>

  <!-- spigot (barbed) -->
  <path d="M720,272 L744,272 L744,266 L768,272 L768,266 L792,272 L800,272 L800,308 L792,308 L768,314 L768,308 L744,314 L744,308 L720,308 Z" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="720" y="280" width="80" height="20" fill="#D8EAEF"/>
  <!-- sensor tube (flexible, separate part) -->
  <rect x="800" y="270" width="82" height="8" fill="#DCE4E8" stroke="#7E94A0" stroke-width="1.2"/>
  <rect x="800" y="302" width="82" height="8" fill="#DCE4E8" stroke="#7E94A0" stroke-width="1.2"/>
  <rect x="800" y="280" width="82" height="20" fill="#D8EAEF"/>
  <line x1="806" y1="290" x2="876" y2="290" stroke="#4C97A8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== SEAM: flanges + glue + captured cuff ===== -->
  <!-- front flange (top + bottom only; middle is the open cot mouth) -->
  <rect x="416" y="224" width="14" height="38" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="416" y="318" width="14" height="38" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="440" y="224" width="14" height="38" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <rect x="440" y="318" width="14" height="38" fill="url(#hatch)" stroke="#6B7280" stroke-width="1"/>
  <!-- glue bead -->
  <rect x="430" y="224" width="10" height="38" fill="url(#glue)" stroke="#C9892F" stroke-width="1"/>
  <rect x="430" y="318" width="10" height="38" fill="url(#glue)" stroke="#C9892F" stroke-width="1"/>
  <!-- open cot mouth = clean port -->
  <rect x="416" y="262" width="38" height="56" fill="#D8EAEF"/>

  <!-- clean dome interior -->
  <path d="M435,262 C330,250 248,272 248,290 C248,308 330,330 435,318 L435,262 Z" fill="#D8EAEF" opacity="0.9"/>
  <!-- membrane dome -->
  <path d="M435,262 C330,250 248,272 248,290 C248,308 330,330 435,318" fill="none" stroke="#0E7C86" stroke-width="3.5"/>
  <!-- cuff beads embedded in seam -->
  <ellipse cx="435" cy="262" rx="7" ry="8" fill="#0E7C86"/>
  <ellipse cx="435" cy="318" rx="7" ry="8" fill="#0E7C86"/>

  <!-- ===== LABELS ===== -->
  <text x="150" y="200" font-size="12.5" fill="#C98A4B" font-weight="600">dirty breath path</text>
  <text x="556" y="246" font-size="12.5" fill="#2A6470" font-weight="600">clean trapped air → spigot</text>

  <line x1="300" y1="150" x2="300" y2="288" stroke="#5A6470" stroke-width="1"/>
  <text x="200" y="142" font-size="12.5" fill="#1F2933" font-weight="600">Slack dome = finger cot (flexes with sip/puff)</text>

  <line x1="435" y1="404" x2="435" y2="330" stroke="#5A6470" stroke-width="1"/>
  <text x="300" y="424" font-size="12" fill="#1F2933">Glue / solvent-weld seam — bonds shells AND</text>
  <text x="300" y="440" font-size="12" fill="#1F2933">captures the cot cuff (airtight at assembly)</text>

  <line x1="640" y1="150" x2="500" y2="290" stroke="#5A6470" stroke-width="1"/>
  <text x="560" y="142" font-size="12" fill="#1F2933">clean air via cot mouth → rear cavity</text>

  <line x1="760" y1="345" x2="760" y2="312" stroke="#5A6470" stroke-width="1"/>
  <text x="660" y="362" font-size="12" fill="#1F2933">barbed spigot → push-fit into tube</text>

  <text x="150" y="184" font-size="12" fill="#1F2933" font-weight="600">FRONT shell</text>
  <text x="600" y="396" font-size="12" fill="#1F2933" font-weight="600">REAR shell</text>

  <!-- bracket -->
  <path d="M70,470 H800" stroke="#9AA0A6" stroke-width="1.4"/>
  <path d="M70,465 V475 M800,465 V475" stroke="#9AA0A6" stroke-width="1.4"/>
  <text x="435" y="490" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="600">ONE sealed disposable Unit — swap the whole module (≈$1.27, see cost CSV)</text>

  <!-- legend -->
  <rect x="40" y="512" width="20" height="13" fill="#F3DFC9" stroke="#C98A4B"/>
  <text x="66" y="523" font-size="11.5" fill="#1F2933">dirty (breath)</text>
  <rect x="180" y="512" width="20" height="13" fill="#D8EAEF" stroke="#4C97A8"/>
  <text x="206" y="523" font-size="11.5" fill="#1F2933">clean (to sensor)</text>
  <line x1="340" y1="518" x2="362" y2="518" stroke="#0E7C86" stroke-width="3.5"/>
  <text x="368" y="523" font-size="11.5" fill="#1F2933">membrane</text>
  <rect x="470" y="512" width="20" height="13" fill="url(#hatch)" stroke="#6B7280"/>
  <text x="496" y="523" font-size="11.5" fill="#1F2933">printed plastic</text>
  <rect x="610" y="512" width="20" height="13" fill="url(#glue)" stroke="#C9892F"/>
  <text x="636" y="523" font-size="11.5" fill="#1F2933">glue / solvent-weld</text>
  <rect x="760" y="512" width="20" height="13" fill="#DCE4E8" stroke="#7E94A0"/>
  <text x="786" y="523" font-size="11.5" fill="#1F2933">flexible tube</text>
</svg>
