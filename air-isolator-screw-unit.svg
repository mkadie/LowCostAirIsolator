# Air Isolator — Working Prototype v1 (preliminary): Release & Call for Feedback

**Part of:** the SipNPuff **Air Isolator** — a latex-free, user-replaceable membrane that isolates a user's breath (saliva, moisture, pathogens) from the pressure sensor and electronics of a sip-and-puff assistive switch. Open-source, R.O.A.R. / TSSFAA.

**Status:** **Working prototype, preliminary.** It screws together and seems to work well in early hands-on use — but it is **not validated**. We want testing, food-safety review, and improvements — from experts, makers, and users alike.

**Plastics / CAD design:** [@JoshDesigns](https://youtube.com/@JoshDesigns) (YouTube)
**Repository:** github.com/mkadie/LowCostAirIsolator · **STL files:** [`/stl`](./stl) · **Plastics/CAD design:** @JoshDesigns (YouTube) / @Joshuaua (GitHub)
**License:** CC BY-NC 4.0

**Companion documents:** full design note → `air-isolator.md` · fabrication/material brief → `AirIsolator_Fabrication_Brief.pdf` · mechanism schematic → `air-isolator-screw-unit.svg`

