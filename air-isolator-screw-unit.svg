## What this is

A first working prototype of the Air Isolator: a few-cent, latex-free, user-replaceable membrane that fully separates the breath path from the pressure sensor, giving both **sensor protection** and **between-user hygiene** in a breath-actuated (sip-and-puff) input device. The full rationale, mounting options, cost model, and references are in `air-isolator.md`.

## What's new in this prototype

- **Screw-together housing.** The two printed shells **screw together and clamp the finger cot cuff at the seam** to form the seal — **no glue**. Because it's screwed rather than bonded, the finger cot is **replaceable**: unscrew, swap the cot, screw it back together. The housing is reusable. (This is the serviceable alternative to the earlier glue-in "Unit," which sealed the cot permanently and was discarded whole — both approaches are documented in the design note.)
- **STL files on GitHub** so anyone can print and reproduce it — front + rear shells in **1/4"** and **1/8" tube** variants (`SipNPuff_-_FrontShell_-_V0_1_-_*in_Tube.stl`, `SipNPuff_-_RearShell_-_V0_1_-_*in_Tube.stl`) — in [`/stl`](./stl).

